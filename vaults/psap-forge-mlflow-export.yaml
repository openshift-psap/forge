env_key: PSAP_FORGE_MLFLOW_EXPORT_SECRET_PATH
description: |
  Vault to push data to production and staging MLflow.
  Select a profile from mlflow-instance-secrets.yaml with /var caliper.export.backend.mlflow.instance: staging.

content:
  mlflow-secret.yaml:
    description: |
      Default MLflow credentials used by jobs without an instance override.
    sample: |
      tracking_uri: ...
      username: "..."
      password: "..."
      insecure_tls: true

  mlflow-instance-secrets.yaml:
    optional: true
    description: |
      Named MLflow credentials, required only when an instance is selected.
    sample: |
      prod:
        tracking_uri: https://mlflow.example
        username: "..."
        password: "..."
      staging:
        tracking_uri: https://mlflow-staging.example
        username: "..."
        password: "..."

  tracking_uri:
    sensible: false #  disable the URI censoring for the time being. We'll re-enable it when we switch the instance.
    censor_text: "https://mlflow_tracking_uri_hidden"
    description: |
      the URI of the MLFlow endpoint, so that the CI engine can censor it in the logs

  username:
    sensible: false
    description: |
      the mlflow username

  password:
    description: |
      the mlflow password, so that the CI engine can censor it in the logs

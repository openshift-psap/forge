env_key: PSAP_FORGE_MLFLOW_EXPORT_SECRET_PATH
description: |
  Vault to push data to production and staging MLflow.
  Both credential files must be present. Select staging with /var mlflow_instance: staging.

content:
  mlflow-secret.yaml:
    description: |
      Caliper secret config file for exporting to MLFlow
    sample: |
      tracking_uri: ...
      username: "..."
      password: "..."
      insecure_tls: true

  mlflow-staging-secret.yaml:
    description: |
      Staging MLflow credentials in the same format as mlflow-secret.yaml.
    sample: |
      tracking_uri: ...
      username: "..."
      password: "..."
      insecure_tls: true

  tracking_uri:
    sensible: false #  disable the URI censoring for the time being. We'll re-enable it when we switch the instance.
    censor_text: "https://mlflow_tracking_uri_hidden"
    description: |
      the URI of the MLFlow endpoint, so that the CI engine can censor it in the logs

  username:
    sensible: false
    description: |
      the mlflow username

  password:
    description: |
      the mlflow password, so that the CI engine can censor it in the logs

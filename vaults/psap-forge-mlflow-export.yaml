env_key: PSAP_FORGE_MLFLOW_EXPORT_SECRET_PATH
description: |
  Vault to push data to production and staging MLflow.
  Select a profile from mlflow-secret.yaml with /var mlflow_instance: staging.

content:
  mlflow-secret.yaml:
    description: |
      MLflow credentials by profile. Existing flat files are accepted for prod.
    sample: |
      prod:
        tracking_uri: https://mlflow.example
        username: "..."
        password: "..."
      staging:
        tracking_uri: https://mlflow-staging.example
        username: "..."
        password: "..."

  tracking_uri:
    sensible: false #  disable the URI censoring for the time being. We'll re-enable it when we switch the instance.
    censor_text: "https://mlflow_tracking_uri_hidden"
    description: |
      the URI of the MLFlow endpoint, so that the CI engine can censor it in the logs

  username:
    sensible: false
    description: |
      the mlflow username

  password:
    description: |
      the mlflow password, so that the CI engine can censor it in the logs

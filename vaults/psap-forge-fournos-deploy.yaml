env_key: PSAP_FORGE_FOURNOS_CI_SECRET_PATH
description: |
  Vault to access FOURNOS Kube API in the PSAP-mgmt cluster

content:
  kubeconfig:
    description: |
      KUBECONFIG file to access the PSAP-mgmt cluster

    rotate_info: |
      from the mgmt cluster:
      $ ./bin/run_toolbox cluster create-sa-kubeconfig ocpci --kubeconfig-file forge.kconfig

env_key: IBMCLOUD_IPI_PROFILE_PATH
description: IBM Cloud IPI installer and operator credentials, using upstream release filenames.
content:
  ibmcloud-api-key:
    description: Infrastructure API key used to create and destroy the cluster.
  ibmcloud-cloud-controller-manager-api-key:
    description: IAM API key for the OpenShift cloud controller manager.
  ibmcloud-cluster-csi-drivers-api-key:
    description: IAM API key for the OpenShift CSI storage drivers.
  ibmcloud-image-registry-api-key:
    description: IAM API key for the OpenShift image registry.
  ibmcloud-ingress-operator-api-key:
    description: IAM API key for the OpenShift ingress operator.
  ibmcloud-machine-api-api-key:
    description: IAM API key for the OpenShift machine API.
  pull-secret:
    description: Registry authentication JSON for the selected OpenShift payload.
  ssh-publickey:
    description: Public half of the SSH key installed on cluster machines.
  ssh-privatekey:
    description: Matching unencrypted SSH private key for installer diagnostics.

env_key: PSAP_FORGE_NOTIFICATIONS_SECRET_PATH
description: |
  Vault to send SLACK and Github notifications

content:
  topsail-bot.private-key.pem:
    description: |
      Private key to send github notifications
    rotation_info: |
      Goto https://github.com/settings/apps/psap-forge-bot
      Credentials -> Key pairs -> New key
  topsail-bot.clientid:
    sensible: false
    description: |
      Public ID of the TOPSAIL-bot client
    rotation_info: |
      No need to rotate

  topsail-bot.slack-token:
    description: |
      Token to send slack notification from the TOPSAIL-bot
    rotation_info: |
      Open api.slack.com/apps and select your app
      In the left sidebar, click OAuth & Permissions.
      --> Revoke All OAuth Tokens
      --> Install to Internal Red Hat
      Add to a channel
      Copy the Bot User OAuth Token (xoxb-1234-1234-xyz)
    format: |
      xoxb-1234...-5768...-abc...xyz

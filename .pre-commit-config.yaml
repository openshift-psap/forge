repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-intent-files
        name: Validate intent files
        entry: scripts/validate_intent_files.py
        language: script
        files: '\.intent\.md$'
        exclude: '(^|/)index\.intent\.md$'

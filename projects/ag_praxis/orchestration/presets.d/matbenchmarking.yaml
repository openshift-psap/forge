__multiple: true

payload_size:
  test.matrix_benchmarking.workload_level.enabled: true
  test.matrix_benchmarking.workload_level.dimensions:
    test.payload: [XS, default, L, XL]
  test.matrix_benchmarking.workload_level.labels:
    test.payload: payload
  test.matrix_benchmarking.visualization:
    legend_keys: [payload]
    group_keys: []

extproc_max_requests:
  test.endpoints: [maas/praxis]
  test.sweep: large
  workloads.replica_count: 4
  workloads.sweeps.large: [512, 1024, 2048, 3072, 4096]
  prom.capture.enabled: false
  test.matrix_benchmarking.deployment_level.enabled: true
  # 224-320 mapped the shedding curve around the former optimum (256); the
  # open question is now headroom, so the sweep moves to the upper half of the
  # controller-enforced range (1-1024, values above are silently rejected and
  # fall back to 8). Admission ceiling stays budget / response_duration, so
  # 1024 with ~5s responses caps at ~200 rps -- beyond that, the answer is
  # shorter responses or a product fix, not a bigger budget.
  test.matrix_benchmarking.deployment_level.dimensions:
    platform.praxis.extproc_max_requests: [256, 512, 1024]

  test.matrix_benchmarking.deployment_level.labels:
    platform.praxis.extproc_max_requests: max_requests
  test.matrix_benchmarking.visualization:
    legend_keys: [max_requests]
    group_keys: []

# Isolate the auth-timeout component of the 500s (the empty-details, ~2s-duration
# rejections from the kuadrant wasm shim's failureMode:deny on auth-service
# timeout): run with the ext_proc budget at the controller ceiling so the
# circuit breaker is NOT the variable, and sweep the auth timeout around the
# kuadrant default (2s). Success-rate deltas per step are the auth path's
# contribution; the ext_proc overflow share should stay flat across steps.
auth_timeout:
  test.endpoints: [maas/praxis]
  test.sweep: large
  workloads.replica_count: 4
  workloads.sweeps.large: [256, 512, 1024]
  platform.praxis.extproc_max_requests: 1024
  prom.capture.enabled: false
  test.matrix_benchmarking.deployment_level.enabled: true
  test.matrix_benchmarking.deployment_level.dimensions:
    platform.praxis.auth_timeout: ["1s", "2s", "5s"]

  test.matrix_benchmarking.deployment_level.labels:
    platform.praxis.auth_timeout: auth_timeout
  test.matrix_benchmarking.visualization:
    legend_keys: [auth_timeout]
    group_keys: []

# Study the ext_proc budget-holding effect: every in-flight streaming request
# holds an ext_proc stream for its full response, and response duration is
# ~ TTFT + ITL x output_tokens (default: 1s + 30ms x ~128 tokens ~ 5s). The
# admission ceiling is roughly extproc_max_requests / duration, so with the
# budget at its measured optimum (256), each ITL step predicts:
#   5ms -> ~1.6s -> ~160 rps   15ms -> ~2.9s -> ~88 rps
#   30ms -> ~4.8s -> ~53 rps   60ms -> ~8.7s -> ~29 rps
# Compare against the measured 200-rate per step (guidellm request status).
# Prometheus capture stays ON so each step also gets the auth_saturation view
# (200-rate ceiling, instant-rejection regime) next to the success counts.
sim_inter_token_latency:
  test.endpoints: [maas/praxis]
  test.sweep: large
  workloads.replica_count: 4
  workloads.sweeps.large: [128, 256, 512, 1024]
  test.matrix_benchmarking.deployment_level.enabled: true
  test.matrix_benchmarking.deployment_level.dimensions:
    platform.sim.inter_token_latency: ["5ms", "15ms", "30ms", "60ms"]

  test.matrix_benchmarking.deployment_level.labels:
    platform.sim.inter_token_latency: itl
  test.matrix_benchmarking.visualization:
    legend_keys: [itl]
    group_keys: []

job_name: guidellm-benchmark
image: ghcr.io/vllm-project/guidellm:v0.7.4
use_pvc: false
pvc_size: 1Gi
pvc_storage_class: null
fs_group: null
timeout_seconds: 3600
args:
  processor: Qwen/Qwen3-0.6B

smoke_request:
  prompt: San Francisco is a
  max_tokens: 50
  temperature: 0.7

benchmarks:
  short:
    timeout_seconds: 3600
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      constraint: kind=max_duration,seconds=120
    rate: [1, 4, 8]

  full:
    timeout_seconds: 7200
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      constraint: kind=max_duration,seconds=120
    rate: [1, 4, 16, 32, 64, 128]

  smoke:
    timeout_seconds: 300
    benchconf: llm-d/smoke

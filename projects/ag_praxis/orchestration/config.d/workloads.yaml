job_name: guidellm-benchmark
image: ghcr.io/vllm-project/guidellm:v0.7.4
use_pvc: false
pvc_size: 1Gi
pvc_storage_class: null
fs_group: null
timeout_seconds: 3600
args:
  processor: gpt2

smoke_request:
  prompt: San Francisco is a
  max_tokens: 50
  temperature: 0.7

warmup_benchmark_key: null

benchmarks:
  warmup:
    job_name: guidellm-warmup
    timeout_seconds: 300
    args:
      profile: "kind=concurrent,streams=4"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      constraint: kind=max_duration,seconds=60

  short:
    timeout_seconds: 3600
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      constraint: kind=max_duration,seconds=40
    rate: [1, 4, 8]

  full:
    timeout_seconds: 7200
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      constraint: kind=max_duration,seconds=180
    rate: [1, 4, 16, 32, 64, 128]

  payload_l:
    timeout_seconds: 3600
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=1000,output_tokens=500
      constraint: kind=max_duration,seconds=180
    rate: [1, 4, 8]

  payload_xl:
    timeout_seconds: 3600
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=4000,output_tokens=4000
      constraint: kind=max_duration,seconds=180
    rate: [1, 4, 8]

  smoke:
    timeout_seconds: 300
    benchconf: llm-d/smoke

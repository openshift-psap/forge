job_name: guidellm
image: null # use the toolbox default value
use_pvc: false
pvc_size: 1Gi
pvc_storage_class: null
fs_group: null
replica_count: 2
timeout_seconds: 3600
validate_backend: false
keep_full_benchmark_file: false
args:
  processor: gpt2
  request_format: /v1/responses
  # Fraction of the run occluded from the metrics at the end, where requests
  # trail off after the last request is issued (guidellm profile cooldown).
  # Values < 1.0 are a percentage; with a max_requests constraint, values >= 1.0
  # would mean an absolute request count, not seconds.
  cooldown: 0.1

smoke_request:
  prompt: San Francisco is a
  max_tokens: 50
  temperature: 0.7

warmup_benchmark_key: null

# Number of requests each stream issues per rate level (max_requests constraint,
# so every request runs fully through). ~180s for the default payload at
# TTFT 1s + 128 x 30ms ITL. Payloads with longer outputs override this to stay
# within timeout_seconds.
requests_per_stream: 36

payloads:
  default:
    prompt_tokens: 256
    output_tokens: 128
  XS:
    prompt_tokens: 128
    output_tokens: 50
  L:
    prompt_tokens: 1000
    output_tokens: 500
    requests_per_stream: 12
  XL:
    prompt_tokens: 4000
    output_tokens: 4000
    requests_per_stream: 3

sweeps:
  smoke: [2, 4]
  small: [8, 16, 32, 64]
  medium: [4, 16, 32, 64, 96, 128]
  large: [32, 64, 128, 196, 256, 360, 512]
  full: [64, 128, 256, 512, 1024]

benchmarks:
  warmup:
    job_name: guidellm-warmup
    timeout_seconds: 300
    args:
      profile: "kind=concurrent,streams=4"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      # 4 streams x 12 requests/stream ~ 60s at the default payload
      constraint: kind=max_requests,count=48

  smoke:
    timeout_seconds: 300
    benchconf: llm-d/smoke

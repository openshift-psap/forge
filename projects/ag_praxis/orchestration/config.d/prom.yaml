prepare:
  user_workload:
    during_prepare: true
    during_test: true

capture:
  enabled: true
  db:
    enabled: true
    system_metrics:
      enabled: true
    user_workload:
      enabled: true
      fail_if_not_enabled: false
  metrics:
    enabled: true
    include_dirs:
      - projects/cluster/metrics
    params:
      namespace: "@test.namespace"
    groups:
      resource_load-generator:
        enabled: true
        files: [resource_cpu, resource_memory, resource_network, workload]
        variables:
          NAMESPACE: "{namespace}"
          POD_NAME: ".*"
      resource_ingress:
        enabled: true
        files: [resource_cpu, resource_memory, resource_network, workload]
        variables:
          NAMESPACE: "openshift-ingress"
          POD_NAME: ".*"
          POD_NAME_EXCLUDE: "payload-.*"
      resource_payload:
        enabled: true
        files: [resource_cpu, resource_memory, resource_network, resource_limits, workload]
        variables:
          NAMESPACE: "openshift-ingress"
          POD_NAME: "payload-.*"

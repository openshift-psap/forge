cluster:
  minimum_openshift_version: "4.19.9"
  skip_gpu_readiness: true
  namespace:
    labels:
      app.kubernetes.io/managed-by: forge
      forge.openshift.io/project: ag_praxis

operators:
  rhcl-operator:
    display_name: Red Hat Connectivity Link
    namespace: openshift-operators
    channel: stable
    source: redhat-operators
    cleanup_crds:
      - ztunnels.sailoperator.io
  rhods-operator:
    name: null
    display_name: Red Hat OpenShift AI
    namespace: redhat-ods-operator
    channel: stable-3.x
    source: redhat-operators
    starting_csv: null

rhoai:
  custom_catalog:
    enabled: false
    name: rhoai-catalog-dev
    namespace: openshift-marketplace
    image: null
    display_name: Red Hat OpenShift AI
    publisher: RHOAI Development Catalog
    pull_secret:
      vault:
        name: psap-rhoai-rc
        content: rhoai_rc.secret
    staging_pull_secret:
      vault:
        name: psap-forge-staging-image-pull
        content: .dockerconfigjson
  namespace: redhat-ods-applications
  datasciencecluster_name: default-dsc
  components:
    - kserve
    - aigateway.maas
  required_crds_before_dsc:
    - datascienceclusters.datasciencecluster.opendatahub.io
  required_crds_after_dsc: []

maas:
  namespace: default
  repo_url: https://github.com/opendatahub-io/models-as-a-service
  repo_ref: 7a652d9aa3b7320f3b0e81ad49e3190a713cc9b1
  operator_type: rhoai
  tenant_namespace: models-as-a-service
  maas_gateway_label: maas-gateway
  llmisvc_name: sim-llm-maas
  # Token quota on the MaaSSubscription registered for the sim model. Deliberately
  # huge so perf runs are not rate-limited. CAVEAT: token metering fails OPEN for
  # streamed /v1/responses traffic on builds where the kuadrant wasm shim parses
  # the response body as a single JSON document -- the limit is not enforced there
  # (see orchestration/poc/maas-praxis-500-ext-proc-overflow.md, Finding 2).
  token_rate_limit: 1000000000
  token_rate_limit_window: 1m
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress

sim:
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.12.0
  model_name: simulated-model
  replicas: 1
  served_model_names:
    - simulated-model
    - simulated-model-1
    - simulated-model-2
    - simulated-model-3
    - simulated-model-4
  time_to_first_token: "1000ms"
  inter_token_latency: "30ms"
  mode: random
  max_num_seqs: 10240

praxis:
  version: "0.6"
  replicas: 1
  # ExtProc concurrency budget (Envoy circuit breakers on the ext_proc clusters,
  # set via the maas.opendatahub.io/experimental-extproc-max-requests annotation on
  # the MaasTenantConfig). The operator default is 8 (ai-gateway-controller PR #217
  # hardening): above 8 concurrent in-flight ext_proc calls, the gateway sheds
  # requests with an instant empty HTTP 500 before auth. Valid range 1-1024;
  # out-of-range values silently fall back to 8. The effective limits are verified
  # against the gateway's live Envoy config after activation.
  # See orchestration/poc/maas-praxis-500-ext-proc-overflow.md (Finding 1).
  extproc_max_requests: 1024
  payload_processing:
    replicas: 4
    cpu_request: 100m
    cpu_limit: 4
    memory_request: null
    memory_limit: 2Gi

artifacts:
  capture_namespace_events: true

cluster:
  minimum_openshift_version: "4.19.9"
  skip_gpu_readiness: true
  namespace:
    labels:
      app.kubernetes.io/managed-by: forge
      forge.openshift.io/project: ag_praxis

operators:
  rhcl-operator:
    enabled: false
    display_name: Red Hat Connectivity Link
    namespace: openshift-operators
    channel: stable # cannot use stable-1.5 for the time being
    source: redhat-operators
    cleanup_crds:
      - ztunnels.sailoperator.io
  rhods-operator:
    name: null
    display_name: Red Hat OpenShift AI
    namespace: redhat-ods-operator
    channel: stable-3.x
    source: redhat-operators
    starting_csv: null

rhoai:
  custom_catalog:
    enabled: false
    force_pull_secret_update: false
    name: rhoai-catalog-dev
    namespace: openshift-marketplace
    image: null
    display_name: Red Hat OpenShift AI
    publisher: RHOAI Development Catalog
    pull_secret:
      vault:
        name: psap-rhoai-rc
        content: rhoai_rc.secret
    staging_pull_secret:
      vault:
        name: psap-forge-staging-image-pull
        content: .dockerconfigjson
  namespace: redhat-ods-applications
  datasciencecluster_name: default-dsc
  components:
    - kserve
    - aigateway.maas
  required_crds_before_dsc:
    - datascienceclusters.datasciencecluster.opendatahub.io
  required_crds_after_dsc: []

maas:
  namespace: default
  repo_url: https://github.com/opendatahub-io/models-as-a-service
  repo_ref: 7a652d9aa3b7320f3b0e81ad49e3190a713cc9b1
  operator_type: rhoai
  tenant_namespace: models-as-a-service
  maas_gateway_label: maas-gateway
  llmisvc_name: sim-llm-maas
  # Token quota on the MaaSSubscription registered for the sim model. Deliberately
  # huge so perf runs are not rate-limited. CAVEAT: token metering fails OPEN for
  # streamed /v1/responses traffic on builds where the kuadrant wasm shim parses
  # the response body as a single JSON document -- the limit is not enforced there
  token_rate_limit: 1000000000
  token_rate_limit_window: 1m
  gateway:
    name: maas-default-gateway
    namespace: openshift-ingress

default_gateway:
  namespace: openshift-ingress
  name: openshift-ai-inference
  gateway_class_name: data-science-gateway-class
  status_address_name: gateway-internal
  create_if_missing: true
  llmisvc_name: sim-llm-gw

sim:
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.12.0
  model_name: simulated-model
  replicas: 1
  served_model_names:
    - simulated-model
    - simulated-model-1
    - simulated-model-2
    - simulated-model-3
    - simulated-model-4
  time_to_first_token: "1000ms"
  inter_token_latency: "30ms"
  mode: random
  max_num_seqs: 10240

praxis:
  # ExtProc concurrency budget (Envoy circuit breakers on the ext_proc clusters,
  # set via the maas.opendatahub.io/experimental-extproc-max-requests annotation on
  # the MaasTenantConfig). The operator default is 8 (ai-gateway-controller PR #217
  # hardening): above 8 concurrent in-flight ext_proc calls, the gateway sheds
  # requests with an instant empty HTTP 500 before auth. Valid range 1-1024;
  # out-of-range values silently fall back to 8. The effective limits are verified
  # against the gateway's live Envoy config after activation.
  extproc_max_requests: 256
  # Identity-metrics toggle for the maas-gateway-auth AuthPolicy (the `metrics`
  # field of the identity response filter, hardcoded true by maas-controller's
  # template). With it on, authorino re-compiles and re-evaluates the filter's
  # CEL label expressions on every request (metricLabels: 72-88% of its CPU in
  # pprof profiles); turning it off cut authorino CPU per successful auth by
  # ~38%. The labels feed usage metering that is broken on streamed
  # /v1/responses anyway (token metering fails open, Finding 2 of
  # maas-praxis-500-ext-proc-overflow.md). Set true for metering-focused runs;
  # null keeps the controller default. Can also be used as a matrix
  # deployment_level dimension ([true, false]) for A/B measurements.
  identity_metrics: false
  # Timeout of the kuadrant wasm shim's auth-service hop to authorino, in Envoy
  # duration format (e.g. "500ms", "2s", "1m"). The kuadrant operator default
  # is 2s with failureMode deny: an auth call that overruns it is turned into
  # an empty-details HTTP 500 (~14% of the 500s on the 2026-11-24 praxis/large
  # run -- the rest was the ext_proc circuit breaker). The timeout is not
  # exposed by any CR: enable_maas_praxis patches it into the kuadrant-generated
  # EnvoyFilter and verifies it against the gateway's live listener config
  # (a kuadrant reconcile reverts the patch, so it is re-checked per endpoint).
  # null keeps the current value. Can also be used as a matrix deployment_level
  # dimension (e.g. ["1s", "2s", "5s"]).
  auth_timeout: null
  payload_processing:
    replicas: 1
    cpu_request: 100m
    cpu_limit: 8
    memory_request: null
    memory_limit: 2Gi

artifacts:
  capture_namespace_events: true

apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llm-d-intelligentr-4e3b09
  annotations:
    security.opendatahub.io/enable-auth: 'false'
    prometheus.io/path: /metrics
    prometheus.io/port: '8000'
    forge.openshift.io/deployment-profile: intelligentrouting-tp4-x4
  namespace: forge-llm-d
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
spec:
  replicas: 4
  model:
    uri: pvc://llm-d-model-openai-gpt-oss-120b-7ab79ddecd/model
    name: openai/gpt-oss-120b
  router:
    scheduler:
      template:
        containers:
        - name: main
        nodeSelector:
          nvidia.com/gpu.present: 'true'
    route: {}
    gateway: {}
  template:
    tolerations: null
    containers:
    - name: main
      resources:
        requests:
          nvidia.com/gpu: '4'
        limits:
          nvidia.com/gpu: '4'
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 900
        periodSeconds: 60
        timeoutSeconds: 60
        failureThreshold: 1000
      readinessProbe:
        failureThreshold: 10000
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 60
        periodSeconds: 30
        successThreshold: 1
        timeoutSeconds: 30
      env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --gpu-memory-utilization=0.92 --trust-remote-code --no-enable-log-requests
          --enable-prefix-caching --max-model-len=4096
  parallelism:
    tensor: 4

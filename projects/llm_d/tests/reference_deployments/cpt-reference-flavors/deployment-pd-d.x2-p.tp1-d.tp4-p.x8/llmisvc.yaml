apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: llm-d-pd-d-x2-p-tp-bfb506
  annotations:
    security.opendatahub.io/enable-auth: 'false'
    prometheus.io/path: /metrics
    prometheus.io/port: '8000'
    forge.openshift.io/deployment-profile: pd-d.x2-p.tp1-d.tp4-p.x8
  namespace: forge-llm-d
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
spec:
  replicas: 2
  model:
    uri: pvc://llm-d-model-openai-gpt-oss-120b-7ab79ddecd/model
    name: openai/gpt-oss-120b
  router:
    scheduler:
      template:
        containers:
        - name: main
        nodeSelector:
          nvidia.com/gpu.present: 'true'
    route: {}
    gateway: {}
  template:
    containers:
    - name: main
      resources:
        requests:
          nvidia.com/gpu: '4'
          rdma/ib: '1'
        limits:
          nvidia.com/gpu: '4'
          rdma/ib: '1'
      env:
      - name: VLLM_ADDITIONAL_ARGS
        value: --gpu-memory-utilization=0.92 --trust-remote-code --no-enable-log-requests
          --enable-prefix-caching --max-model-len=4096 --block-size 128 --kv-transfer-config
          '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: VLLM_HOST_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
    metadata:
      labels:
        app.kubernetes.io/component: decode
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: prefill
            topologyKey: kubernetes.io/hostname
  prefill:
    replicas: 8
    parallelism:
      tensor: 1
    template:
      containers:
      - name: main
        resources:
          requests:
            nvidia.com/gpu: '1'
            rdma/ib: '1'
          limits:
            nvidia.com/gpu: '1'
            rdma/ib: '1'
        env:
        - name: VLLM_ADDITIONAL_ARGS
          value: --gpu-memory-utilization=0.92 --trust-remote-code --no-enable-log-requests
            --enable-prefix-caching --max-model-len=4096 --block-size 128 --kv-transfer-config
            '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: VLLM_HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
      metadata:
        labels:
          app.kubernetes.io/component: prefill
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: decode
              topologyKey: kubernetes.io/hostname
  parallelism:
    tensor: 4

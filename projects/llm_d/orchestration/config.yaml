vaults:
  all: []
  all-optional: []
  prepare: []
  prepare-optional:
  - psap-forge-hf
  test: []
  test-optional:
  - psap-forge-hf

caliper:
  export:
    from: null
    verbose: true
    dry_run: false
    backend:
      mlflow:
        enabled: true
        secrets:
          vault:
            name: psap-forge-mlflow-export
            mlflow_secret: mlflow-secret.yaml
        config:
          experiment: forge-llm_d
          workspace: forge-llmd
          run_name:
          description: >
            Caliper export from FORGE
          source_script: llm_d project
          tags: {}
          parameters: {}
          metrics: {}
    notifications:
      enabled: true
      vault: psap-forge-notifications

  replot:
    url: null  # Set via /replot.url directive
    keep: false  # Set to true to keep download directory after replotting

  postprocess:
    enabled: true
    artifacts_dir: null
    plugin_module: projects.guidellm.postprocess.guidellm.plugin
    postprocess_config: null
    parse:
      enabled: true
      no_cache: false
    visualize:
      enabled: true
      output_dir: null
      reports: []
      report_group: all
      visualize_config: projects/guidellm/postprocess/guidellm/visualize-groups.yaml

    kpi:
      enabled: true
      artifacts_to_kpis:
        enabled: true
        output: kpis/kpis.json
      kpis_to_csv:
        enabled: true
        output: kpis/kpis.csv
        include_header_comments: true
      artifacts_to_ai_data:
        enabled: true
        output_dir: ai_data

    analyze:
      enabled: true
      historical_kpis: historical_data
      output: regression_analyze/kpi_analyze.json

    s3:
      bucket: psap-dashboard-data
      instance: smoke
      directory: llmd-dashboard
      vault:
        name: psap-forge-aws-s3-export
        aws_credentials_file: aws.credentials
      prefix: llm_d/
      import:
        enabled: true
        output_dir: historical_data
        include_kpis_json: true
        include_kpis_csv: false
        include_ai_data: false
        max_downloads: 50
      export:
        enabled: true
        upload_id: null  # use timestamp if null
        dry_run: false
        include_csv: true
        include_kpis_json: true
        include_ai_data: true

    analyse_kpis:
      enabled: false
      output: kpi_analysis.json

agentic:
  enabled: true
  model_key: qwen-3-6-35b
  on_failure:
    enabled: true
  config_review:
    enabled: true

cleanup:
  preserve_operators:
    # see the list in config.d/platform.yaml
    gpu-operator-certified: true
    nfd: true
    openshift-cert-manager-operator: true

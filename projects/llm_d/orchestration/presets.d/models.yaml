__multiple: true

gpt-oss:
  runtime.model_name: openai/gpt-oss-120b
  runtime.router.peak_prefill_throughput: 55928
  runtime.model_topology:
    replicas: 4
    tensor_parallelism: 2
  runtime.smoke_request_key: default
  model_cache.pvc.size: 300Gi
  workloads.args:
    backend: "request_format=/v1/completions"

llama3-70b:
  runtime.model_name: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
  model_cache.pvc.size: 100Gi
  runtime.smoke_request_key: default

gemma-4-26b-fp8:
  runtime.model_name: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
  runtime.router.peak_prefill_throughput: 61005
  runtime.model_topology:
    replicas: 8
    tensor_parallelism: 1
  model_cache.pvc.size: 100Gi
  runtime.smoke_request_key: default

defaults:
  labels:
    app.kubernetes.io/managed-by: forge
    forge.openshift.io/project: llm_d
  replicas: 1
  tensor_parallelism: 1
  serving_image: null
  router_image: null
  enable_monitors: true
  node_selector: {} # pinned onto the serving/prefill pod templates, not the scheduler
  vllm_extra:
    args:
      gpu_memory_utilization: 0.92
      trust_remote_code: true
      no_enable_log_requests: true
      enable_prefix_caching: true

pd:
  vllm_extra:
    args:
    - --block-size 128
    kv_transfer_config:
      kv_connector: NixlConnector
      kv_role: kv_both
    env:
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
    - name: VLLM_HOST_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
  ib:
    enabled: false
    resources: rdma/ib

  roce:
    enabled: false
    resources: composite.dra.io/gpu-nic-pair
    # Each GPU-NIC pair brings its own GPU: request one pair per GPU instead
    # of nvidia.com/gpu, so that no GPU is handed out twice.
    gpus_from_resource: true

    vllm_extra:
      env:
      - name: KSERVE_INFER_ROCE
        value: "true"
      - name: NCCL_IB_GID_INDEX
        value: "3"

  efa:
    enabled: false
    image: quay.io/rajjoshi/libfabric-addon:3.5.0-1784900545
    manifest: manifests/pd-efa-config.yaml

    vllm_extra:
      kv_transfer_config:
        kv_connector_extra_config:
          backends: [LIBFABRIC]

    resources: vpc.amazonaws.com/efa

  shmem:
    size: null

profiles:
  approximate-prefix-cache:
    scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml

  precise-prefix-cache:
    scheduler_manifest: manifests/deployments/precise-prefix-cache.yaml

  distributed-default:
    scheduler: {}

  release-approximate-prefix-cache:
    scheduler_manifest: manifests/deployments/approximate-prefix-cache.yaml
    replicas: 4
    tensor_parallelism: 2

  release-precise-prefix-cache:
    scheduler_manifest: manifests/deployments/precise-prefix-cache.yaml
    replicas: 4
    tensor_parallelism: 2
    annotations:
      benchflow.io/prefix-caching: precise
    vllm_extra:
      args:
        prefix_caching_hash_algo: sha256_cbor
        block_size: 64
        # The serving image expands VLLM_ADDITIONAL_ARGS through `eval`; literal
        # single quotes keep the JSON intact for vLLM after that shell parse.
        kv_events_config: "'{\"enable_kv_cache_events\": true, \"publisher\": \"zmq\", \"endpoint\": \"tcp://__INFERENCE_SERVICE_NAME__-epp-service:5557\", \"topic\": \"kv@$(POD_IP)@$(MODEL_NAME)\"}'"
      env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: MODEL_NAME
          value: __MODEL_NAME__
        - name: PYTHONHASHSEED
          value: "42"

  release-distributed-default:
    scheduler: {}
    replicas: 4
    tensor_parallelism: 2

  pd-3.5GA-router-p.tp1-p.x8-d.tp4-d.x2:
    scheduler_manifest: manifests/scheduler_config/default-3.5GA-pd.yaml
    router_image: registry.redhat.io/rhoai/odh-llm-d-router-endpoint-picker-rhel9@sha256:b4a5c8d6650a4ea3c7ae47b8ba16e9c52484d2f758f588447e4f96d6ec751e41
    scheduler:
      annotations:
        app.kubernetes.io/version: "0.9.0"
    tensor_parallelism: FROM_NAME
    prefill:
      replicas: FROM_NAME
      tensor_parallelism: FROM_NAME
    decode:
      replicas: FROM_NAME
      tensor_parallelism: FROM_NAME

  default-3.6GA:
    scheduler_manifest: manifests/deployments/default-3.6GA.yaml
    topology_from_model: true

  default-3.5GA-router:
    scheduler_manifest: manifests/deployments/default-3.5GA.yaml
    router_image: registry.redhat.io/rhoai/odh-llm-d-router-endpoint-picker-rhel9@sha256:b4a5c8d6650a4ea3c7ae47b8ba16e9c52484d2f758f588447e4f96d6ec751e41
    scheduler:
      annotations:
        app.kubernetes.io/version: "0.9.0"
    topology_from_model: true

# Template flavor configurations with name-based extraction
templates:
  pd:
    scheduler_manifest: {}  # scheduler enabled with default config
    tensor_parallelism: FROM_NAME  # Extract main deployment tensor parallelism from profile name

    prefill:
      replicas: FROM_NAME
      tensor_parallelism: FROM_NAME
    decode:
      replicas: FROM_NAME
      tensor_parallelism: FROM_NAME


  intelligentrouting:
    scheduler_manifest: {}  # scheduler enabled with default config
    tensor_parallelism: FROM_NAME
    replicas: FROM_NAME

  simple:
    scheduler_manifest: null # scheduler disabled
    tensor_parallelism: FROM_NAME
    replicas: FROM_NAME

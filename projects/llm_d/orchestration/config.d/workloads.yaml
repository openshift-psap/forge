job_name: guidellm-benchmark
image: ghcr.io/vllm-project/guidellm:v0.5.4
use_pvc: false
pvc_size: 1Gi
pvc_storage_class: null
fs_group: null
timeout_seconds: 3600
args: {}

smoke_requests:
  default:
    prompt: San Francisco is a
    max_tokens: 50
    temperature: 0.7

benchmarks:
  default:
    vllm_args:
      max_model_len: 4096

  short:
    timeout_seconds: 3600
    outputs: json
    args:
      backend_type: openai_http
      rate: [1, 4, 8]
      rate_type: concurrent
      max_seconds: 120
      sample_requests: 20
      data: prompt_tokens=256,output_tokens=128

  concurrent-1k-1k:
    timeout_seconds: 3600
    args:
      backend_type: openai_http
      rate_type: concurrent
      rate: [1, 50, 100, 200, 300]
      data: prompt_tokens=1000,output_tokens=1000
      max_seconds: 600

  heavy-heterogeneous:
    timeout_seconds: 3600
    vllm_args:
      max_model_len: 40960
    args:
      backend_type: openai_http
      rate_type: concurrent
      rate: [1, 50, 100, 200, 300]
      data: prompt_tokens=8000,prompt_tokens_stdev=8500,prompt_tokens_min=50,prompt_tokens_max=30000,output_tokens=800,output_tokens_stdev=1500,output_tokens_min=20,output_tokens_max=8000
      max_seconds: 600

  multi-turn:
    vllm_args:
      max_model_len: 40960
    # One Job runs all five rates sequentially; the high-rate cases need more
    # than the default one-hour wall-clock budget.
    timeout_seconds: 7200
    args:
      backend_type: openai_http
      rate_type: concurrent
      rate: [32, 64, 128, 256, 512]
      data: prompt_tokens=128,output_tokens=128,turns=5,prefix_tokens=10000,prefix_count={2*rate}
      max_requests: "{10*rate}"

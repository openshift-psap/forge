job_name: guidellm-benchmark
image: ghcr.io/vllm-project/guidellm:v0.8.1
use_pvc: false
pvc_size: 1Gi
pvc_storage_class: null
fs_group: null
timeout_seconds: 3600
args: {}

smoke_requests:
  default:
    prompt: San Francisco is a
    max_tokens: 50
    temperature: 0.7

benchmarks:
  default:
    vllm_args:
      max_model_len: 4096

  short:
    timeout_seconds: 3600
    args:
      profile: "kind=concurrent,streams={rate}"
      data: kind=synthetic_text,prompt_tokens=256,output_tokens=128
      constraint: kind=max_duration,seconds=120
    rate: [1, 4, 8]

  smoke:
    timeout_seconds: 300
    benchconf: llm-d/smoke

  concurrent-1k-1k:
    timeout_seconds: 3600
    benchconf: llm-d/concurrent-1k-1k

  heavy-heterogeneous:
    timeout_seconds: 3600
    vllm_args:
      max_model_len: 40960
    benchconf: llm-d/concurrent-heavy-heterogeneous

  multi-turn:
    vllm_args:
      max_model_len: 40960
    timeout_seconds: 7200
    benchconf: llm-d/multi-turn

vaults:
  all: []
  all-optional: []
  prepare: []
  prepare-optional: []
  test: []
  test-optional: []

skeleton:
  collect_cluster_info: false
  namespace: skeleton-dev
  properties:
    rate: 1
    data: prompt_tokens=128
    max_requests: 30
  extra_properties: {} # for the preset to give any extra property
  deep_testing: false
  test:
    duration_seconds: 0  # Default test duration in seconds

caliper:
  export:
    from: null
    verbose: true
    dry_run: false
    backend:
      mlflow:
        enabled: true
        secrets:
          vault:
            name: psap-forge-mlflow-export
            mlflow_secret: mlflow-secret.yaml

        config:
          # Same keys/values as docs/caliper/mlflow-config.example.yaml
          workspace: forge-sandbox
          experiment: forge-skeleton
          run_name:
          description: >
            Caliper export from FORGE
          source_script: skeleton project
          tags: {}
          parameters: {}
          metrics: {}
    notifications:
      enabled: true
      vault: psap-forge-notifications

  replot:
    url: null  # Set via /replot.url directive
    keep: false  # Set to true to keep download directory after replotting

  postprocess:
    enabled: true
    artifacts_dir: null
    plugin_module: projects.skeleton.postprocess.default.plugin
    postprocess_config: null
    parse:
      enabled: true
      no_cache: false
    visualize:
      enabled: true
      output_dir: null
      reports: [summary_table, throughput_chart]
      report_group: null

    kpi:
      enabled: true
      artifacts_to_kpis:
        enabled: true
        output: kpis/kpis.json
      kpis_to_csv:
        enabled: false
        output: kpis/kpis.csv
        include_header_comments: true
      artifacts_to_ai_data:
        enabled: true
        output_dir: ai_data

    analyze:
      enabled: true
      historical_kpis: historical_data
      output: regression_analyze/kpi_analyze.json

    s3:
      bucket: psap-dashboard-data
      instance: smoke
      directory: skeleton-dashboard
      prefix: skeleton/
      vault:
        name: psap-forge-aws-s3-export
        aws_credentials_file: aws.credentials
      import:
        enabled: true
        output_dir: historical_data
        include_kpis_json: true
        include_kpis_csv: false
        include_ai_data: false
        max_downloads: 50
      export:
        enabled: true
        upload_id: null  # use timestamp if null
        dry_run: false
        include_csv: false
        include_kpis_json: true
        include_ai_data: true

agentic:
  enabled: true
  model_key: qwen-3-6-35b
  on_failure:
    enabled: true
  config_review:
    enabled: true

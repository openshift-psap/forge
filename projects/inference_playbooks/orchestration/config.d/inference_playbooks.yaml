# Direct path beneath models/: <model>/recipes/<recipe-folder>, not recipe_id.
# Null validates the catalog only. Example: kimi-k3/recipes/h200-x8-pp2-tp8-8k1k
recipe: null
# Mandatory for a launch; canonical path relative to the selected recipe folder.
# Example: manifests/vllm-v0.29.0/leaderworkerset.yaml
# The path selects a platform, not a subset of its published YAML/YML artifacts.
manifest_path: null
namespace: kserve-e2e-perf
deploy:
  node_selector: {}
workload: profile1
rdma_resource: null
lws_ready_timeout_seconds: 7200
readiness_timeout_seconds: 7200

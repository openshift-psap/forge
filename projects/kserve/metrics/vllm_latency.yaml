    histogram_quantile(0.99, sum(rate({__name__=~"kserve_vllm:time_to_first_token_seconds_bucket", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m])) by (le))

# params:
#   LLMISVC_NAMESPACE: Target namespace
#   LLMISVC_NAME: Name of the vLLM LLMInferenceService

- query: >-
    histogram_quantile(0.5, sum(rate({__name__=~"kserve_vllm:time_to_first_token_seconds_bucket", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m])) by (le))
  metricName: ttft_p50_seconds
  description: Ttft p50 seconds
  unit: seconds

- query: >-
    histogram_quantile(0.9, sum(rate({__name__=~"kserve_vllm:time_to_first_token_seconds_bucket", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m])) by (le))
  metricName: ttft_p90_seconds
  description: Ttft p90 seconds
  unit: seconds


params:
  llmisvc_namespace:
    description: Target namespace
  llmisvc_name:
    description: Name of the vllm llmisvc

ttft_p50_seconds:
  category: vllm-latency
  tags: [percentile]
  description: Ttft p50 seconds
  unit: seconds
  promql: >-
    histogram_quantile(0.5, sum(rate({__name__=~"(vllm|kserve_vllm):time_to_first_token_seconds_bucket", namespace="{llmisvc_namespace}", pod=~"{llmisvc_name}-kserve-.*"}[5m])) by (le))


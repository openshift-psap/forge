# params:
#   LLMISVC_NAMESPACE: Target namespace
#   LLMISVC_NAME: Name of the vLLM LLMInferenceService
#
# Shared by the llm_d and ag_praxis projects. KServe deployments re-expose
# the vLLM metrics with a `kserve_vllm:` prefix, while raw vLLM deployments
# (e.g. the llm-d simulator) expose them as `vllm:`. The queries match both.
#
# The workload pods are typically scraped twice (operator PodMonitor on the
# engine plus the ServiceMonitor on the workload service), which yields
# duplicate series per pod. Queries aggregate with `max by (pod, ...)` to
# deduplicate them; with a single scrape path the result is unchanged.
# Service-wide sums nest the dedup inside the sum for the same reason.

- query: >-
    max by (pod) (rate({__name__=~"(kserve_)?vllm:generation_tokens_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m]))
  metricName: generation_token_rate_per_second
  description: Generation token rate per second
  unit: ratio

- query: >-
    sum(max by (pod) (rate({__name__=~"(kserve_)?vllm:generation_tokens_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m])))
  metricName: generation_token_rate_sum_per_second
  description: Generation token rate sum per second
  unit: ratio

- query: >-
    max by (pod) ({__name__=~"(kserve_)?vllm:generation_tokens_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"})
  metricName: generation_tokens_total
  description: Generation tokens total
  unit: ratio

- query: >-
    max by (pod) (rate({__name__=~"(kserve_)?vllm:prompt_tokens_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m]))
  metricName: prompt_token_rate_per_second
  description: Prompt token rate per second
  unit: ops/s

- query: >-
    max by (pod) ({__name__=~"(kserve_)?vllm:prompt_tokens_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"})
  metricName: prompt_tokens_total
  description: Prompt tokens total
  unit: count

- query: >-
    max by (pod, source) (rate({__name__=~"(kserve_)?vllm:prompt_tokens_by_source_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*", source=~"local_compute|local_cache_hit|external_kv_transfer"}[5m]))
  metricName: prompt_tokens_rate_by_source
  description: Prompt tokens rate by source
  unit: ops/s

- query: >-
    max by (pod) ({__name__=~"(kserve_)?vllm:num_requests_running", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"})
  metricName: num_requests_running
  description: Num requests running
  unit: count

- query: >-
    max by (pod) ({__name__=~"(kserve_)?vllm:num_requests_waiting", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"})
  metricName: num_requests_waiting
  description: Num requests waiting
  unit: count

- query: >-
    max by (pod, state) (label_replace({__name__=~"(kserve_)?vllm:num_requests_running", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}, "state", "running", "__name__", ".*") or label_replace({__name__=~"(kserve_)?vllm:num_requests_waiting", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}, "state", "waiting", "__name__", ".*"))
  metricName: requests_running_waiting
  description: Requests running waiting
  unit: count

- query: >-
    max by (pod, reason) ({__name__=~"(kserve_)?vllm:num_requests_waiting_by_reason", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"} or label_replace({__name__=~"(kserve_)?vllm:num_requests_waiting", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}, "reason", "unspecified", "__name__", ".*"))
  metricName: requests_waiting_by_reason
  description: Requests waiting by reason
  unit: count

- query: >-
    max by (pod) (rate({__name__=~"(kserve_)?vllm:num_preemptions_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m]))
  metricName: num_preemptions_rate
  description: Num preemptions rate
  unit: ops/s

- query: >-
    max by (pod) (rate({__name__=~"(kserve_)?vllm:request_success_total", namespace="{{.LLMISVC_NAMESPACE}}", pod=~"{{.LLMISVC_NAME}}-kserve-.*"}[5m]))
  metricName: request_success_rate_by_pod
  description: Request success rate by pod
  unit: ops/s

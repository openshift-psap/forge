# ──────────────────────────────────────────────
# RHAIIS 3.6 release regression — H200
# ──────────────────────────────────────────────
cpt-rhaiis-3.6-h200:
  __description: "RHAIIS 3.6 release regression — H200 model matrix"
  __engine: vllm
  __accelerator: nvidia
  __gpu_type: h200
  __clusters:
    - hera
    - zeus
    - old-zeus
  __models:
    qwen3-vl-30b/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    qwen3-5-122b/tp2:
      rhaiis.engines.vllm.args.tensor-parallel-size: 2
      rhaiis.engines.vllm.args.reasoning-parser: qwen3
      rhaiis.engines.vllm.args.language-model-only: true
    qwen3-5-397b/tp4:
      rhaiis.engines.vllm.args.tensor-parallel-size: 4
      rhaiis.engines.vllm.args.reasoning-parser: qwen3
      rhaiis.engines.vllm.args.language-model-only: true
    deepseek-v4-pro/tp8:
      __workloads: [profile1, profile4, profile5, profile7, profile6]
      rhaiis.engines.vllm.args.tensor-parallel-size: 8
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
      rhaiis.engines.vllm.args.tokenizer-mode: deepseek_v4
      rhaiis.engines.vllm.args.tool-call-parser: deepseek_v4
      rhaiis.engines.vllm.args.enable-auto-tool-choice: true
      rhaiis.engines.vllm.args.reasoning-parser: deepseek_v4
    gemma-4-26b-fp8/tp2:
      rhaiis.engines.vllm.args.tensor-parallel-size: 2
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
      rhaiis.engines.vllm.args.reasoning-parser: gemma4
      rhaiis.engines.vllm.args.tool-call-parser: gemma4
      rhaiis.engines.vllm.args.enable-auto-tool-choice: true
    gemma-4-26b-bf16/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    gemma-4-31b-bf16/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    gemma-4-31b-fp8-block/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
      rhaiis.engines.vllm.args.reasoning-parser: gemma4
      rhaiis.engines.vllm.args.tool-call-parser: gemma4
      rhaiis.engines.vllm.args.enable-auto-tool-choice: true
    gemma-4-e4b/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    gemma-4-12b/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    nemotron3super-120b/tp2:
      rhaiis.engines.vllm.args.tensor-parallel-size: 2
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
    nemotron3ultra-550b/tp8:
      rhaiis.engines.vllm.args.tensor-parallel-size: 8
      rhaiis.engines.vllm.args.enable-expert-parallel: true
      rhaiis.engines.vllm.args.reasoning-parser: nemotron_v3
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
      rhaiis.engines.vllm.args.tool-call-parser: qwen3_coder
    gpt-oss-120b/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    ministral-14b/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    muse-glimmer/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
      rhaiis.engines.vllm.args.generation-config: auto
      rhaiis.engines.vllm.args.enable-auto-tool-choice: true
      rhaiis.engines.vllm.args.tool-call-parser: muse_glimmer
      rhaiis.engines.vllm.args.reasoning-parser: muse_glimmer
    inkling-small-fp8/tp4:
      rhaiis.engines.vllm.args.tensor-parallel-size: 4
    deepseek-v4-flash-base/tp4:
      __workloads: [profile1, profile4, profile5, profile7, profile6]
      rhaiis.engines.vllm.args.tensor-parallel-size: 4
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
      rhaiis.engines.vllm.args.tokenizer-mode: deepseek_v4
      rhaiis.engines.vllm.args.tool-call-parser: deepseek_v4
      rhaiis.engines.vllm.args.enable-auto-tool-choice: true
      rhaiis.engines.vllm.args.reasoning-parser: deepseek_v4
    infomaniak-translategemma/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
    qwen3-8-27b-int4/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
      rhaiis.engines.vllm.args.kv-cache-dtype: fp8
      rhaiis.engines.vllm.args.enable-auto-tool-choice: true
      rhaiis.engines.vllm.args.tool-call-parser: qwen3_xml
      rhaiis.engines.vllm.args.reasoning-parser: qwen3
      rhaiis.engines.vllm.args.mm-encoder-tp-mode: data
      rhaiis.engines.vllm.args.speculative-config: '{"model":"Qwen3.8-27B-speculator.dspark-preview","num_speculative_tokens":8,"method":"dspark"}'
    qwen3-8-27b-bf16/tp1:
      rhaiis.engines.vllm.args.tensor-parallel-size: 1
      rhaiis.engines.vllm.args.reasoning-parser: qwen3
    glm-5-3-flash/tp8:
      __workloads: [profile1, profile4, profile5, profile7, profile6]
      rhaiis.engines.vllm.args.tensor-parallel-size: 8
      rhaiis.engines.vllm.args.kv-cache-dtype: bfloat16

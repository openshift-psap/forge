namespace: kserve-e2e-perf
accelerator: nvidia
cluster_tag: ""

gpu_types:
  nvidia: h200
  amd: mi300x
  l40s: l40s

engine: vllm

engines:
  vllm:
    images:
      nvidia: vllm/vllm-openai:v0.24.0
      amd: quay.io/aipcc/rhaiis/rocm-ubi9:3.2.5
    port: 8080
    args:
      gpu-memory-utilization: 0.92
      trust-remote-code: true
      no-enable-log-requests: true
      no-enable-prefix-caching: true
      uvicorn-log-level: debug
  sglang:
    images:
      nvidia: lmsysorg/sglang:v0.5.11
      amd: lmsysorg/sglang:v0.5.4.post2-rocm700-mi30x
    port: 8080
    args: 
      enable-metrics: true
  trtllm:
    images:
      nvidia: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc13
    port: 8888
    args: {}
    trtllm_config:
      kv_cache_config:
        dtype: auto
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.90
        mamba_ssm_cache_dtype: ""
        mamba_ssm_stochastic_rounding: false
        mamba_ssm_philox_rounds: 0
      cuda_graph_config:
        enable_padding: false
        max_batch_size: 256
      enable_attention_dp: false
      enable_chunked_prefill: false
      num_postprocess_workers: 0
      moe_config:
        backend: CUTLASS
      stream_interval: 0
      print_iter_log: false

deploy:
  replicas: 1
  cpu_request: "4"
  memory_request: "16Gi"
  storage_source: hf
  storage_pvc: model-pvc
  image_pull_secrets: []
  service_account_name: ""
  ready_timeout: 3600
  health_check_timeout: 120

env_vars: {}

accelerator_env_vars:
  nvidia: {}
  amd:
    VLLM_ROCM_USE_AITER: "1"

s3:
  bucket: psap-dashboard-data
  vault: psap-forge-dashboard-s3
  credentials_file: aws.credentials

warmup:
  rate: 200
  max_seconds: 60

profiler:
  enabled: false
  # webhook: mutating injector + /tmp/profiler_gate (vLLM only)
  # native: vLLM --profiler-config + POST /start_profile /stop_profile
  #         (SGLang uses the same HTTP API with SGLANG_TORCH_PROFILER_DIR)
  backend: webhook
  # native kind: torch (Chrome/Perfetto), cuda (Nsight CUDA profiler API),
  # proton (Triton Proton; requires enforce-eager)
  kind: torch
  traces_dir: /tmp/vllm_profile
  s3_bucket: psap-dashboard-data
  s3_prefix: pytorch-profiles/rhaiis
  vault: psap-forge-dashboard-s3
  labels: []
  rates: [200]
  max_seconds: 200
  native:
    delay_iterations: 0
    max_iterations: 0
    wait_iterations: 0
    warmup_iterations: 0
    active_iterations: 5
    ignore_frontend: true
    record_shapes: false
    with_stack: true
    with_memory: false
    with_flops: false
    use_gzip: true
    dump_cuda_time_total: true
    stop_timeout_seconds: 1800
    nsys_wrap: false
    proton_output_format: chrome_trace
    proton_hook: triton
    num_steps: 0
    start_step: 0
    activities:
      - CPU
      - GPU

agent_analysis:
  enabled: false
  severity_threshold: 10
  url: ""

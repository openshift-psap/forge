ci-quick:
  data: "prompt_tokens=1000,output_tokens=1000"
  rates: [1, 5]
  max_seconds: 60

# BenchConf owns GuideLLM data, rates, duration, and ramp-up. Forge's separate
# pre-benchmark warmup still uses the local warmup duration.
profile1:
  benchconf: rhaiis-regression/concurrent-1k-1k-equal
  warmup: 75

profile2:
  benchconf: rhaiis-regression/concurrent-512-2ki-norm
  warmup: 75

profile3:
  benchconf: rhaiis-regression/concurrent-2ki-128-equal
  warmup: 75

profile4:
  benchconf: rhaiis-regression/concurrent-8k-1k-equal
  warmup: 75

profile5:
  benchconf: rhaiis-regression/concurrent-100k-1k-equal
  warmup: 75

profile6:
  benchconf: rhaiis-regression/concurrent-128-128-multiturn
  warmup: 75

profile7:
  benchconf: rhaiis-regression/concurrent-8k-800-norm
  warmup: 75

# Public selectors for /var runtime.benchmark_key, matching LLM_D's interface.
benchmarks:
  ci-quick:
    workload_key: ci-quick
  concurrent-1k-1k:
    workload_key: profile1
  concurrent-512-2ki:
    workload_key: profile2
  concurrent-2ki-128:
    workload_key: profile3
  concurrent-8k-1k:
    workload_key: profile4
  concurrent-100k-1k:
    workload_key: profile5
  concurrent-128-128-multiturn:
    workload_key: profile6
  concurrent-8k-800:
    workload_key: profile7
  custom:
    workload_key: custom

# Dashboard override stub (set data, rates, max_seconds, rampup, and warmup at runtime)
custom:
  data: "prompt_tokens=1000,output_tokens=1000"
  rates: [1]
  max_seconds: 275
  rampup: 35
  warmup: 75

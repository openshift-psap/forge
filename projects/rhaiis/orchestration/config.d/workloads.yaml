ci-quick:
  data: "prompt_tokens=1000,output_tokens=1000"
  rates: [1, 5]
  max_seconds: 60

aiperf-smoke:
  tool: aiperf
  concurrency: 1
  request_count: 10
  input_tokens: 128
  output_tokens: 64

profile1:
  data: "prompt_tokens=1000,output_tokens=1000"
  rates: [1,50,100,200,300]
  max_seconds: 275
  rampup: 35
  warmup: 75

profile2:
  data: "prompt_tokens=512,prompt_tokens_stdev=128,prompt_tokens_min=1,prompt_tokens_max=1024,output_tokens=2048,output_tokens_stdev=512,output_tokens_min=1,output_tokens_max=4096"
  rates: [1,50,100,200,300]
  max_seconds: 275
  rampup: 35
  warmup: 75

profile3:
  data: "prompt_tokens=2048,output_tokens=128"
  rates: [1, 50, 100, 200, 300]
  max_seconds: 275
  rampup: 35
  warmup: 75

profile4:
  data: "prompt_tokens=8000,output_tokens=1000"
  rates: [1,25,50,75,100]
  max_seconds: 275
  rampup: 35
  warmup: 75
  samples: 50

profile5:
  data: "prompt_tokens=100000,output_tokens=1000"
  rates: [1, 2, 5]
  max_seconds: 275
  rampup: 35
  warmup: 75
  samples: 10

profile6:
  data: "prompt_tokens=128,output_tokens=128,turns=5,prefix_buckets[0].prefix_count=10000,prefix_buckets[0].prefix_tokens=512"
  rates: [1, 32, 64, 128, 256, 512]
  max_seconds: 275
  rampup: 35
  warmup: 75

profile7:
  data: "prompt_tokens=8000,prompt_tokens_stdev=8500,prompt_tokens_min=50,prompt_tokens_max=30000,output_tokens=800,output_tokens_stdev=1500,output_tokens_min=20,output_tokens_max=8000"
  rates: [1, 50, 100, 200, 300]
  max_seconds: 275
  rampup: 35
  warmup: 75

aiperf-agentx-128k:
  tool: aiperf
  ssl_verify: false
  concurrency: 32
  timeout_seconds: 7200
  aiperf_args:
    - --scenario
    - inferencex-agentx-mvp
    - --public-dataset
    - semianalysis_cc_traces_weka_062126
    - --max-context-length
    - "128000"
    - --benchmark-duration
    - "1800"
    - --agentic-cache-warmup-duration
    - "600"
    - --warmup-grace-period
    - "1800"
    - --failed-request-threshold
    - "0.10"
    - --use-server-token-count
    - --tokenizer-trust-remote-code
    - --num-dataset-entries
    - "393"
    - --slice-duration
    - "1.0"
    - --output-artifact-dir
    - /results

aiperf-agentx-unlimited:
  tool: aiperf
  ssl_verify: false
  concurrency: [1, 4, 16, 32]
  timeout_seconds: 7200
  aiperf_args:
    - --scenario
    - inferencex-agentx-mvp
    - --public-dataset
    - semianalysis_cc_traces_weka_062126
    - --benchmark-duration
    - "1800"
    - --agentic-cache-warmup-duration
    - "600"
    - --warmup-grace-period
    - "1800"
    - --failed-request-threshold
    - "0.10"
    - --use-server-token-count
    - --tokenizer-trust-remote-code
    - --num-dataset-entries
    - "393"
    - --slice-duration
    - "1.0"
    - --output-artifact-dir
    - /results

# Dashboard override stub (set data, rates, max_seconds, rampup, and warmup at runtime)
custom:
  data: "prompt_tokens=1000,output_tokens=1000"
  rates: [1]
  max_seconds: 275
  rampup: 35
  warmup: 75

__multiple: true

benchmark:
  tests.rhaiis.run_benchmark: true
  tests.rhaiis.slack_notify_always: true
  rhaiis.profiler.enabled: true
  caliper.postprocess.csv_dashboard.enabled: true
  rhaiis.agent_analysis.enabled: false

benchmark-standard:
  extends:
  - benchmark
  runtime.benchmark_key:
  - concurrent-1k-1k
  - concurrent-8k-1k

benchmark-multi-turn-prefix-on:
  extends:
  - benchmark
  - prefix-cache-on
  runtime.benchmark_key: concurrent-128-128-multiturn

benchmark-multi-turn-prefix-off:
  extends:
  - benchmark
  - prefix-cache-off
  runtime.benchmark_key: concurrent-128-128-multiturn

benchmark-heavy-heterogeneous:
  extends:
  - benchmark
  runtime.benchmark_key: concurrent-8k-800

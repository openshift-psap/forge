__multiple: true

hera:
  rhaiis.cluster_tag: "hera2"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]
  benchmarks.guidellm.fs_group: 0

zeus:
  rhaiis.cluster_tag: "zeus2"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]
  benchmarks.guidellm.fs_group: 0

old-zeus:
  rhaiis.cluster_tag: "zeus1"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]

mi355x:
  rhaiis.cluster_tag: "mi355x"
  rhaiis.gpu_types.amd: "mi355x"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]
  rhaiis.deploy.supplemental_groups: [1000790000]
  benchmarks.guidellm.fs_group: 0

b200:
  rhaiis.cluster_tag: "b200"
  rhaiis.gpu_types.nvidia: "b200"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]
  # FlashInfer JIT compilation must use a writable path in restricted Pods.
  rhaiis.env_vars:
    FLASHINFER_CUBIN_DIR: "/tmp/flashinfer"

athena-fire:
  rhaiis.cluster_tag: "athena"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]
  benchmarks.guidellm.fs_group: 0

janus:
  rhaiis.cluster_tag: "janus"
  rhaiis.gpu_types.nvidia: "nvidia"
  rhaiis.csv_accelerator: "H200"
  rhaiis.deploy.image_pull_secrets: ["npalaska-image-pull"]
  benchmarks.guidellm.fs_group: 0

# ── Cluster + accelerator combos ────────────────────────────
# Usage: /test fournos rhaiis
#   /cluster hera

cluster_hera:
  extends: [nvidia, hera]

cluster_zeus:
  extends: [nvidia, zeus]

cluster_old_zeus:
  extends: [nvidia, old-zeus]

cluster_athena-fire:
  extends: [nvidia, athena-fire]

cluster_janus:
  extends: [nvidia, janus]

# params:
#   NAMESPACE: Target namespace
#   POD_NAME: Pod name regex for the GPU metrics capture
#   POD_NAME_EXCLUDE: Pod name regex to exclude (default: ^$ matches nothing)

- param_defaults:
    POD_NAME_EXCLUDE: "^$"

- query: >-
    DCGM_FI_DEV_GPU_UTIL{exported_namespace="{{.NAMESPACE}}", exported_pod=~"{{.POD_NAME}}", exported_pod!~"{{.POD_NAME_EXCLUDE}}"}
  metricName: gpu_utilization
  description: GPU compute utilization
  unit: percent
  legendLabels: [exported_pod, gpu]

- query: >-
    DCGM_FI_DEV_FB_USED{exported_namespace="{{.NAMESPACE}}", exported_pod=~"{{.POD_NAME}}", exported_pod!~"{{.POD_NAME_EXCLUDE}}"}
  metricName: gpu_fb_memory_used
  description: GPU framebuffer memory used
  unit: MiB
  legendLabels: [exported_pod, gpu]

- query: >-
    DCGM_FI_DEV_FB_FREE{exported_namespace="{{.NAMESPACE}}", exported_pod=~"{{.POD_NAME}}", exported_pod!~"{{.POD_NAME_EXCLUDE}}"}
  metricName: gpu_fb_memory_free
  description: GPU framebuffer memory free
  unit: MiB
  legendLabels: [exported_pod, gpu]


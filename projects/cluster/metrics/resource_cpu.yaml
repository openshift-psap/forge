# params:
#   NAMESPACE: Target namespace
#   POD_NAME: Pod name regex for the resource capture
#   POD_NAME_EXCLUDE: Pod name regex to exclude (default: ^$ matches nothing)

- param_defaults:
    POD_NAME_EXCLUDE: "^$"

- query: >-
    rate(container_cpu_usage_seconds_total{namespace="{{.NAMESPACE}}", pod=~"{{.POD_NAME}}", pod!~"{{.POD_NAME_EXCLUDE}}"}[5m])
  metricName: cpu_usage_by_pod
  description: Cpu usage by pod
  unit: cores
  legendLabels: [container, pod]

- query: >-
    avg(rate(container_cpu_usage_seconds_total{namespace="{{.NAMESPACE}}", pod=~"{{.POD_NAME}}", pod!~"{{.POD_NAME_EXCLUDE}}"}[5m]))
  metricName: avg_cpu_usage
  description: Avg cpu usage
  unit: cores

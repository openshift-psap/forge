# GitOps-managed resolve Job template for FORGE deployments.
#
# NOTE: This is NOT the template the Fournos operator loads at startup.
# The operator uses fournos/config/resolve/resolve_job.yaml (the source of
# truth). This file exists for ArgoCD/GitOps deployment pipelines that apply
# a pre-configured, image-pinned variant. Keep the container spec (command,
# env) consistent with the canonical template in the fournos repo.
#
# Uses the Fournos execution-engine entrypoint contract
# (/opt/fournos/entrypoint). All FORGE-specific bootstrap logic lives in the
# image at bin/fournos_entrypoint; this YAML carries none of it.
apiVersion: batch/v1
kind: Job
metadata:
  name: forge-resolve-job-template
  labels:
    app: forge
    component: resolve
  annotations:
    description: "Template for FORGE resolve jobs"
spec:
  backoffLimit: 0
  suspend: true
  template:
    spec:
      serviceAccountName: fournos
      restartPolicy: Never
      containers:
        - name: resolve
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/forge-core:latest
          imagePullPolicy: Always
          command: ["/opt/fournos/entrypoint"]
          args: []
          env:
            - name: FJOB_NAME
            - name: FOURNOS_WORKLOAD_NAMESPACE
            - name: FOURNOS_STEP
              value: resolve-fournos-config
            - name: FOURNOS_CI
              value: "true"

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: forge-step
spec:
  workspaces:
    - name: artifacts
      description: Shared artifact storage across pipeline tasks.
  params:
    - name: fjob-name
      type: string
    - name: fournos-workload-namespace
      type: string
    - name: kubeconfig-secret
      type: string
      default: "fournos-clusterless-placeholder"
      description: "Kubeconfig secret name. Uses placeholder for clusterless jobs."
    - name: job-step
      type: string
    - name: job-step-name
      type: string
    - name: always-send-notification
      type: string
      default: "false"
    - name: forge-wait-for-step
      type: string
      default: "false"

  steps:
    - name: forge
      image: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/forge-core:latest
      imagePullPolicy: Always
      # No script/command override needed beyond the fixed Fournos
      # execution-engine entrypoint contract — all FORGE-specific bootstrap
      # logic (PR checkout, spec.env export, run_ci dispatch) lives in the
      # image itself at /opt/fournos/entrypoint (see bin/fournos_entrypoint).
      # This step definition is now identical in shape to any other engine's
      # Task; only the env values and image differ.
      command: ["/opt/fournos/entrypoint"]
      args: []
      env:
      - name: ARTIFACT_DIR
        value: "$(workspaces.artifacts.path)"
      - name: TARGET_KUBECONFIG
        value: /var/run/secrets/fournos-kubeconfig/kubeconfig
      - name: KUBECONFIG_SECRET_PARAM
        value: "$(params.kubeconfig-secret)"
      - name: FJOB_NAME
        value: "$(params.fjob-name)"
      - name: FOURNOS_WORKLOAD_NAMESPACE
        value: "$(params.fournos-workload-namespace)"
      - name: FOURNOS_STEP
        value: "$(params.job-step)"
      - name: FOURNOS_STEP_NAME
        value: "$(params.job-step-name)"
      - name: FOURNOS_SECRETS
        value: /var/run/secrets/fournos
      - name: FOURNOS_CI
        value: "true"
      - name: PSAP_FORGE_ALWAYS_SEND_NOTIFICATION
        value: "$(params.always-send-notification)"
      - name: PSAP_FORGE_WAIT_FOR_STEP
        value: "$(params.forge-wait-for-step)"

      volumeMounts:
        - name: kubeconfig
          mountPath: /var/run/secrets/fournos-kubeconfig
          readOnly: true
        - name: vault-secrets
          mountPath: /var/run/secrets/fournos
          readOnly: true

  volumes:
    - name: kubeconfig
      secret:
        secretName: $(params.kubeconfig-secret)
        optional: true

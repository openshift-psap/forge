apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: forge-step
spec:
  workspaces:
    - name: artifacts
      description: Shared artifact storage across pipeline tasks.
  params:
    - name: fjob-name
      type: string
    - name: fournos-workload-namespace
      type: string
    - name: kubeconfig-secret
      type: string
      default: "fournos-clusterless-placeholder"
      description: "Kubeconfig secret name. Uses placeholder for clusterless jobs."
    - name: job-step
      type: string
    - name: job-step-name
      type: string
    - name: always-send-notification
      type: string
      default: "false"
    - name: forge-wait-for-step
      type: string
      default: "false"

  results:
    - name: preemption-cleanup-verified
      description: Set to true only after a RHAIIS job's target resources are gone.

  steps:
    - name: forge
      image: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/forge-core:latest
      imagePullPolicy: Always
      env:
      - name: TARGET_KUBECONFIG
        value: /var/run/secrets/fournos-kubeconfig/kubeconfig
      - name: KUBECONFIG_SECRET_PARAM
        value: "$(params.kubeconfig-secret)"
      - name: FJOB_NAME
        value: "$(params.fjob-name)"
      - name: FOURNOS_WORKLOAD_NAMESPACE
        value: "$(params.fournos-workload-namespace)"
      - name: FOURNOS_STEP
        value: "$(params.job-step)"
      - name: FOURNOS_STEP_NAME
        value: "$(params.job-step-name)"
      - name: FOURNOS_SECRETS
        value: /var/run/secrets/fournos
      - name: FOURNOS_CI
        value: "true"
      - name: PSAP_FORGE_ALWAYS_SEND_NOTIFICATION
        value: "$(params.always-send-notification)"
      - name: PSAP_FORGE_WAIT_FOR_STEP
        value: "$(params.forge-wait-for-step)"
      - name: TASK_SERVICE_ACCOUNT
        valueFrom:
          fieldRef:
            fieldPath: spec.serviceAccountName

      volumeMounts:
        - name: kubeconfig
          mountPath: /var/run/secrets/fournos-kubeconfig
          readOnly: true
        - name: vault-secrets
          mountPath: /var/run/secrets/fournos
          readOnly: true
      script: |
        #!/usr/bin/env bash

        set -o pipefail
        set -o errexit
        set -o nounset
        set -o errtrace

        export ARTIFACT_BASE_DIR="$(workspaces.artifacts.path)"
        export ARTIFACT_DIR="${ARTIFACT_BASE_DIR}/${FOURNOS_STEP_NAME}"
        mkdir -p "${ARTIFACT_DIR}"

        exec &> >(tee -a "$ARTIFACT_DIR/run.log")

        # Fetch FournosJob from the hub cluster (in-cluster SA) before
        # switching KUBECONFIG to the target cluster.
        oc get "fjob/$FJOB_NAME" -n "$FOURNOS_WORKLOAD_NAMESPACE" -oyaml > $ARTIFACT_DIR/fournos_fjob.yaml
        FORGE_PROJECT=$(yq -r '.spec.executionEngine.forge.project' "$ARTIFACT_DIR/fournos_fjob.yaml")
        if [[ -z "$FORGE_PROJECT" || "$FORGE_PROJECT" == null ]]; then
          echo "ERROR: invalid Forge project in $FOURNOS_WORKLOAD_NAMESPACE/$FJOB_NAME"
          exit 1
        fi
        PREEMPTION_CLEANUP_TASK=""
        PREEMPTION_CLEANUP_PROJECT=""
        if [[ "$TASK_SERVICE_ACCOUNT" == fournos-pipeline-readonly ]]; then
          # Fournos snapshots the contract onto the PipelineRun only for a
          # deployed-image run. Check it before any PR source can be used.
          pipeline_run_json=$(oc get "pipelinerun/$FJOB_NAME" -n "$FOURNOS_WORKLOAD_NAMESPACE" -o json)
          PREEMPTION_CLEANUP_TASK=$(jq -r '.metadata.annotations["fournos.dev/preemption-cleanup-task"] // ""' <<< "$pipeline_run_json")
          PREEMPTION_CLEANUP_PROJECT=$(jq -r '.metadata.annotations["fournos.dev/preemption-cleanup-project"] // ""' <<< "$pipeline_run_json")
          unset pipeline_run_json
        fi
        readonly PREEMPTION_CLEANUP_TASK PREEMPTION_CLEANUP_PROJECT
        if [[ -n "$PREEMPTION_CLEANUP_TASK" ]]; then
          if [[ "$FORGE_PROJECT" != "$PREEMPTION_CLEANUP_PROJECT" ]]; then
            echo "ERROR: Forge project changed after this cleanup-verified PipelineRun started"
            exit 1
          fi
          source_pull_sha=$(yq -r '.spec.env.PULL_PULL_SHA // ""' "$ARTIFACT_DIR/fournos_fjob.yaml")
          source_pull_number=$(yq -r '.spec.env.PULL_NUMBER // ""' "$ARTIFACT_DIR/fournos_fjob.yaml")
          if [[ -n "$source_pull_sha" || -n "$source_pull_number" ]]; then
            echo "ERROR: PR source override was added after this deployed-image PipelineRun started"
            exit 1
          fi
        fi

        # Check if we have a kubeconfig for target cluster
        if [[ "$KUBECONFIG_SECRET_PARAM" != "fournos-clusterless-placeholder" && -f "$TARGET_KUBECONFIG" ]]; then
          echo "Setting up target cluster kubeconfig..."
          export KUBECONFIG=$TARGET_KUBECONFIG
          export CLUSTERLESS_MODE="false"

        else
          if [[ "$KUBECONFIG_SECRET_PARAM" == "fournos-clusterless-placeholder" ]]; then
            echo "Running in clusterless mode - no target cluster kubeconfig"
          else
            echo "WARNING: Expected kubeconfig not found at: $TARGET_KUBECONFIG"
            echo "Running in clusterless mode as fallback"
          fi
          export CLUSTERLESS_MODE="true"
        fi

        # Function to conditionally export environment variables from FournosJob spec
        export_env_var_from_fjob() {
          local var_name="$1"
          case "$var_name" in
            KUBECONFIG|TARGET_KUBECONFIG|KUBECONFIG_SECRET_PARAM|FJOB_NAME|FOURNOS_WORKLOAD_NAMESPACE|FOURNOS_STEP|FOURNOS_STEP_NAME|CLUSTERLESS_MODE|ARTIFACT_BASE_DIR|ARTIFACT_DIR|FORGE_HOME|PATH|HOME|FOURNOS_SECRETS|FOURNOS_CI|FORGE_PROJECT|TASK_SERVICE_ACCOUNT|PREEMPTION_CLEANUP_TASK|PREEMPTION_CLEANUP_PROJECT|PSAP_FORGE_WAIT_FOR_STEP|PSAP_FORGE_ALWAYS_SEND_NOTIFICATION)
              echo "ERROR: spec.env cannot override Forge control variable $var_name"
              exit 1
              ;;
          esac
          local value=$(cat "$ARTIFACT_DIR/fournos_fjob.yaml" | yq -r ".spec.env.${var_name}")
          if [[ "$value" != null ]]; then
            export "$var_name=$value"
            echo "Exported $var_name"
          else
            unset "$var_name" 2>/dev/null || true
            echo "Unset $var_name (was null in FournosJob spec)"
          fi
        }

        # Export all environment variables from FournosJob spec.env
        for var_name in $(cat "$ARTIFACT_DIR/fournos_fjob.yaml" | yq -r '.spec.env // {} | keys[]'); do
          export_env_var_from_fjob "$var_name"
        done

        if [[ "${PULL_PULL_SHA:-}" ]]; then
          echo
          echo "Updating to PULL_PULL_SHA=$PULL_PULL_SHA ..."

          git -C "$FORGE_HOME" fetch --quiet origin "$PULL_PULL_SHA"
          git -C "$FORGE_HOME" reset --hard FETCH_HEAD

        elif [[ "${PULL_NUMBER:-}" ]]; then
          echo
          echo "Updating to the HEAD commit of PR $PULL_NUMBER ..."
          commit="refs/pull/$PULL_NUMBER/head"

          git -C "$FORGE_HOME" fetch --quiet origin "$commit"
          git -C "$FORGE_HOME" reset --hard FETCH_HEAD
          export PULL_PULL_SHA="$(git rev-parse HEAD)"
          echo "Setting PULL_PULL_SHA to '$PULL_PULL_SHA'"
        else
          echo "No PULL_PULL_SHA nor PULL_NUMBER, using the image commit"
        fi
        git show --quiet

        exec bin/run_ci "$FORGE_PROJECT" ci "$FOURNOS_STEP"

    # A separate container uses the deployed image even when the forge step
    # checked out PR code. Its success is part of the post-cleanup TaskRun.
    - name: verify-rhaiis-cleanup
      image: image-registry.openshift-image-registry.svc:5000/$(context.taskRun.namespace)/forge-core:latest
      imagePullPolicy: Always
      env:
      - name: TARGET_KUBECONFIG
        value: /var/run/secrets/fournos-kubeconfig/kubeconfig
      - name: KUBECONFIG_SECRET_PARAM
        value: "$(params.kubeconfig-secret)"
      - name: FJOB_NAME
        value: "$(params.fjob-name)"
      - name: FOURNOS_WORKLOAD_NAMESPACE
        value: "$(params.fournos-workload-namespace)"
      - name: FOURNOS_STEP
        value: "$(params.job-step)"
      volumeMounts:
        - name: kubeconfig
          mountPath: /var/run/secrets/fournos-kubeconfig
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ "$FOURNOS_STEP" != post-cleanup ]]; then
          exit 0
        fi

        # Only deployed-image RHAIIS runs have this snapshotted contract.
        # PR-checkout runs are held for manual verification by Fournos.
        if ! pipeline_run_json=$(oc get "pipelinerun/$FJOB_NAME" -n "$FOURNOS_WORKLOAD_NAMESPACE" -o json 2>/dev/null); then
          echo "Could not inspect PipelineRun cleanup contract; no result emitted"
          exit 0
        fi
        contract_project=$(jq -r '.metadata.annotations["fournos.dev/preemption-cleanup-project"] // ""' <<< "$pipeline_run_json")
        contract_task=$(jq -r '.metadata.annotations["fournos.dev/preemption-cleanup-task"] // ""' <<< "$pipeline_run_json")
        if [[ "$contract_project" != rhaiis || -z "$contract_task" ]]; then
          exit 0
        fi
        unset pipeline_run_json

        # PipelineRun status is held by the hub and cannot be changed by the
        # PR's container. It tells the verifier whether the test Task started
        # even if PR code removed the shared artifact directory.
        if ! test_task_ref=$(oc get "pipelineruns.tekton.dev/$FJOB_NAME" -n "$FOURNOS_WORKLOAD_NAMESPACE" \
          -o jsonpath='{.status.childReferences[?(@.pipelineTaskName=="03-test")].name}' 2>/dev/null); then
          echo "Could not inspect test Task status; no cleanup result emitted"
          exit 0
        fi
        test_started=false
        if [[ -n "$test_task_ref" ]]; then
          test_started=true
        fi

        if [[ "$KUBECONFIG_SECRET_PARAM" == fournos-clusterless-placeholder || ! -f "$TARGET_KUBECONFIG" ]]; then
          echo "RHAIIS cleanup verification requires the target kubeconfig; no result emitted"
          exit 0
        fi

        export KUBECONFIG="$TARGET_KUBECONFIG"
        if ! python3 -I "$FORGE_HOME/projects/rhaiis/orchestration/verify_cleanup.py" \
          "$(workspaces.artifacts.path)" "$FJOB_NAME" "$(command -v oc)" "$test_started"; then
          echo "RHAIIS cleanup could not be verified; no result emitted"
          exit 0
        fi
        printf 'true' > "$(results.preemption-cleanup-verified.path)"

  volumes:
    - name: kubeconfig
      secret:
        secretName: $(params.kubeconfig-secret)
        optional: true
